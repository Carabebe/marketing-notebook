<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} img{max-width:100%} body{margin:0}</style>
<title>Hannah · 营销手记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Caveat:wght@500&family=Jost:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: editorial portfolio. Split-screen home; inner pages = minimal top bar, huge tight serif titles, outline pills,
   full-bleed black-ruled 2-column grids, tilted "screen" collages as heroes, tinted meta-table sections. */
:root{
  --bg:#F6F5F1; --panel:#ECEBE6; --surface:#FBFAF7; --ink:#141414; --ink-2:#55534D; --ink-3:#8C8A83; --line:#D9D7D0; --rule:#141414; --hover:#EFEEE9; --bezel:#1B1B1B; --rim:#9A9893;
  --geo:"Jost","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --serif:"Bodoni Moda","Noto Serif SC","Songti SC",serif;
  --zhserif:"Noto Serif SC","Songti SC",serif;
  --gut:clamp(18px,4vw,56px);
  --brand-b:#F8D3DE; --brand-i:#8E3550; --ecom-b:#FAD8BF; --ecom-i:#8A4A18; --cmi-b:#F7EBB8; --cmi-i:#665A0E; --trade-b:#DDEDC2; --trade-i:#4A6420;
  --crm-b:#C9EDE0; --crm-i:#1F6650; --pr-b:#D6D6F7; --pr-i:#45448E; --media-b:#CBE3F7; --media-i:#245E8C; --digital-b:#EFD5F2; --digital-i:#74357F;
  --ins:#A8716A; --ins-bg:#F6EEEC; --prac:#9C7B5E; --prac-bg:#F5EFE9; --data:#7A6F66; --data-bg:#F1EFEC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --panel:#1C1C1B; --surface:#191918; --ink:#EDEBE5; --ink-2:#B5B2AA; --ink-3:#85827B; --line:#33322F; --rule:#EDEBE5; --hover:#222220; --bezel:#3A3936; --rim:#55534F;
  --brand-b:#6B3A4A; --brand-i:#F8D3DE; --ecom-b:#6E4A30; --ecom-i:#FAD8BF; --cmi-b:#5E5426; --cmi-i:#F7EBB8; --trade-b:#48582E; --trade-i:#DDEDC2;
  --crm-b:#285A4A; --crm-i:#C9EDE0; --pr-b:#3F3F72; --pr-i:#D6D6F7; --media-b:#2F5170; --media-i:#CBE3F7; --digital-b:#5E3D68; --digital-i:#EFD5F2;
  --ins:#D9A49D; --ins-bg:#2B2120; --prac:#C9A585; --prac-bg:#2A231C; --data:#B4A99F; --data-bg:#24221F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1C1C1B; --surface:#191918; --ink:#EDEBE5; --ink-2:#B5B2AA; --ink-3:#85827B; --line:#33322F; --rule:#EDEBE5; --hover:#222220; --bezel:#3A3936; --rim:#55534F;
  --brand-b:#6B3A4A; --brand-i:#F8D3DE; --ecom-b:#6E4A30; --ecom-i:#FAD8BF; --cmi-b:#5E5426; --cmi-i:#F7EBB8; --trade-b:#48582E; --trade-i:#DDEDC2;
  --crm-b:#285A4A; --crm-i:#C9EDE0; --pr-b:#3F3F72; --pr-i:#D6D6F7; --media-b:#2F5170; --media-i:#CBE3F7; --digital-b:#5E3D68; --digital-i:#EFD5F2;
  --ins:#D9A49D; --ins-bg:#2B2120; --prac:#C9A585; --prac-bg:#2A231C; --data:#B4A99F; --data-bg:#24221F;
  color-scheme:dark}
.fn-brand{--b:var(--brand-b);--i:var(--brand-i)} .fn-ecom{--b:var(--ecom-b);--i:var(--ecom-i)} .fn-cmi{--b:var(--cmi-b);--i:var(--cmi-i)} .fn-trade{--b:var(--trade-b);--i:var(--trade-i)}
.fn-crm{--b:var(--crm-b);--i:var(--crm-i)} .fn-pr{--b:var(--pr-b);--i:var(--pr-i)} .fn-media{--b:var(--media-b);--i:var(--media-i)} .fn-digital{--b:var(--digital-b);--i:var(--digital-i)}
.ab-ins{--a:var(--ins);--abg:var(--ins-bg)} .ab-prac{--a:var(--prac);--abg:var(--prac-bg)} .ab-data{--a:var(--data);--abg:var(--data-bg)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--geo);font-size:15px;line-height:1.75;font-weight:400;overflow-x:clip}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}
p{margin:0}
.caps{font-family:var(--geo);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:12px}
.gut{padding-inline:var(--gut)}

/* ---------- 首页 ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100svh}
.home-left{padding:clamp(40px,9vh,110px) clamp(20px,6vw,88px) 40px;display:flex;flex-direction:column;gap:30px;border-right:2px solid var(--rule)}
.home-right{background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px clamp(20px,4vw,60px);text-decoration:none;position:relative;overflow:hidden}
.home .era{font-size:15px;letter-spacing:.14em;color:var(--ink-2);font-weight:400}
.home .name{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(64px,9vw,128px);line-height:.92;letter-spacing:-.035em}
.bigpills{display:flex;flex-wrap:wrap;gap:12px}
.bigpill{border:2px solid var(--ink);border-radius:999px;padding:7px 20px;font-size:clamp(14px,1.4vw,18px);font-weight:500;letter-spacing:.12em}
.bigpill.ghost{border-color:var(--ink-3);color:var(--ink-2)}
.intro{max-width:560px;font-size:14.5px;line-height:1.8;color:var(--ink-2);font-weight:300}
.index{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.index a{display:flex;align-items:baseline;gap:22px;text-decoration:none;padding:4px 0}
.index .no{font-size:14px;color:var(--ink-3);letter-spacing:.06em;width:22px;font-variant-numeric:tabular-nums}
.index .lb{font-size:clamp(28px,3.2vw,40px);font-weight:400;letter-spacing:-.01em;line-height:1.15;transition:transform .2s}
.index .zh{font-size:14px;color:var(--ink-3)}
.index a:hover .lb{transform:translateX(6px)}
.homelinks{margin-top:auto;display:flex;flex-wrap:wrap;gap:12px 36px;font-size:14px;letter-spacing:.12em;color:var(--ink-3)}
.homelinks span{cursor:default}
.homelinks span::after{content:" ↗"}
.logo-mark{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(44px,5.4vw,76px);letter-spacing:-.03em;line-height:.9;color:var(--i);text-align:center}
.logo-mark small{display:block;font-size:.2em;letter-spacing:.3em;font-weight:500;color:var(--ink-2);margin-top:12px}

/* ---------- 拼贴：倾斜的“屏幕”卡片 ---------- */
.collage-art{position:relative;width:100%;height:var(--h,360px)}
.tile{position:absolute;left:var(--x);top:var(--y);width:var(--w,190px);transform:rotate(var(--r,0deg));background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent),0 1px 2px rgba(0,0,0,.03),0 20px 44px -10px rgba(0,0,0,.13);overflow:hidden;display:flex;flex-direction:column}
.tile .tbar{height:20px;background:var(--b);display:flex;align-items:center;gap:4px;padding:0 9px}
.tile .tbar i{width:6px;height:6px;border-radius:50%;background:var(--i);opacity:.45}
.tile .tin{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;font-weight:500}
.tile .v{font-family:"Jost",sans-serif;font-weight:600;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.tile .q{font-family:var(--zhserif);font-weight:600;font-size:14px;line-height:1.55}
.tile .wm{font-family:"Jost",sans-serif;font-weight:600;font-size:25px;line-height:.95;letter-spacing:-.03em;color:var(--i)}
.tile.phone{border-radius:24px;border:2.5px solid var(--bezel);box-shadow:0 2px 4px rgba(0,0,0,.05),0 24px 48px -12px rgba(0,0,0,.2)}
.tile .chiprow{display:flex;flex-wrap:wrap;gap:4px}
.tile .chiprow span{font-size:11px;border:1px solid var(--ink-3);border-radius:999px;padding:1px 8px}

.tile .shot{aspect-ratio:4/5;background:var(--panel);display:grid;place-items:center;overflow:hidden}
.tile .shot span{font-size:11px;letter-spacing:.2em;color:var(--ink-3)}
.tile .shot img{width:100%;height:100%;object-fit:cover;display:block}
/* 设备样机：照片放在 iPad / iPhone 里（参考网站的做法） */
.dev{position:relative;background:var(--panel);border:3px solid var(--bezel);overflow:hidden;box-shadow:0 0 0 1.5px var(--rim),0 2px 4px rgba(0,0,0,.05),0 24px 48px -14px rgba(0,0,0,.22)}
.dev img{width:100%;height:100%;object-fit:cover;display:block}
.dev .scr{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;letter-spacing:.22em;color:var(--ink-3)}
.dev.ipad{border-radius:15px;aspect-ratio:4/3;border-width:6px}
.dev.iphone{border-radius:26px;aspect-ratio:9/19}
.dev.iphone::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:30%;height:9px;border-radius:8px;background:var(--bezel);z-index:1}
.collage-art .dev{position:absolute;left:var(--x);top:var(--y);width:var(--w);transform:rotate(var(--r,0deg))}
.devs{position:relative;width:100%;aspect-ratio:2.15/1}
.devs .dev{position:absolute}
.mascot{width:56px;height:56px;display:inline-block;flex:none;transition:transform .3s}
.mascot svg{width:100%;height:100%;overflow:visible}
.cell:hover .mascot{transform:rotate(-8deg) scale(1.08)}
/* ---------- 内页外壳 ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:64px;padding:0 var(--gut)}
.top a{text-decoration:none}
.top nav{display:flex;gap:4px 28px;flex-wrap:wrap}
.top nav a{padding:4px 0;border-bottom:1px solid transparent;color:var(--ink-2)}
.top nav a.on,.top nav a:hover{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-block:0 0;min-height:70vh}
.pagehead{display:flex;flex-direction:column;gap:12px;padding:52px var(--gut) 40px}
.pagehead .caps{color:var(--ink-3)}
.giant{font-family:var(--serif);font-weight:500;font-size:clamp(46px,7.4vw,104px);line-height:.98;letter-spacing:-.035em}
.giant.zh{font-family:var(--zhserif);font-weight:700;letter-spacing:-.01em;font-size:clamp(34px,5vw,64px);line-height:1.15}
.subzh{font-family:var(--zhserif);font-weight:600;font-size:clamp(17px,1.8vw,22px);color:var(--ink-2)}
.lede{max-width:62ch;color:var(--ink-2)}
h2{font-family:var(--zhserif);font-size:21px;font-weight:600;line-height:1.4}
h3{font-size:15px;font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);border-radius:999px;padding:5px 15px;font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;white-space:nowrap;background:transparent;color:var(--ink);font-family:var(--geo);cursor:pointer;line-height:1.4}
a.pill:hover,button.pill:hover,.cell:hover .pill.view{background:var(--ink);color:var(--bg)}
.pill.on{background:var(--ink);color:var(--bg)}
.pill.zh{letter-spacing:.06em;font-size:13px;text-transform:none}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 0 1px var(--i) inset}
.section{display:flex;flex-direction:column;gap:14px;margin-top:48px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:10px}
.count{font-size:12px;color:var(--ink-3);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.grid-2{display:grid;gap:22px 48px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.chip{display:inline-flex;align-items:center;font-size:12.5px;line-height:1;padding:6px 11px;border-radius:999px;background:var(--b);color:var(--i);text-decoration:none;white-space:nowrap}
.ind{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ind svg{width:15px;height:15px;flex:none}
.cpt{font-size:13px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.cpt b{font-weight:400;color:var(--ink-3);margin-right:1px}
.cpt:hover{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.empty-note{border:1.5px dashed var(--line);padding:18px 20px;color:var(--ink-3);font-size:14px}

/* ---------- 通栏黑线网格（参考 SELECTED WORK） ---------- */
.xgrid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));border-top:1px solid var(--rule)}
.cell{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:18px;padding:26px 30px 28px;text-decoration:none;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);min-width:0;transition:background .2s}
.xgrid .cell:nth-child(var(--cols,2)n){border-right:none}
.xgrid.c2 .cell:nth-child(2n){border-right:none}
.xgrid.c4 .cell:nth-child(4n){border-right:none}
a.cell:hover{background:var(--hover)}
.cell .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cell .yr{font-size:22px;font-weight:600;letter-spacing:.06em}
.cell .vis{flex:1;display:flex;align-items:center;justify-content:center;min-height:var(--vh,360px)}
.cell .title{font-size:clamp(15px,1.3vw,18px);font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.cell .title .zh{display:block;text-transform:none;letter-spacing:.02em;font-family:var(--zhserif);font-weight:600;font-size:15px;color:var(--ink-2);margin-top:4px}
.cell .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cell.blank{justify-content:center;align-items:center;color:var(--ink-3)}
.fnno{font-family:var(--serif);font-size:56px;line-height:1;color:var(--i)}
.fnname{font-family:var(--zhserif);font-size:24px;font-weight:700}

/* 列表行 */
.rows{border-top:1px solid var(--rule)}
.row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:16px var(--gut);border-bottom:1px solid var(--line);text-decoration:none}
.row:hover{background:var(--hover)}
.row .rt{min-width:0}
.row .rt .t{font-size:16px}
.inrows .row{padding-inline:0}
.inrows .row:hover{background:transparent}
.inrows .row:hover .rt{text-decoration:underline;text-underline-offset:3px}
.metrics{display:flex;flex-wrap:wrap;gap:8px}
.metric{font-size:13px;border:1px solid var(--ink-3);border-radius:999px;padding:4px 12px}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:14px}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* 信息表 */
.meta{display:flex;flex-direction:column;margin:0}
.meta>div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;padding:18px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.meta>div:first-child{padding-top:4px}
.meta dt{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding-top:3px}
.meta dd{margin:0;min-width:0;font-size:15px;line-height:1.7}

/* 案例页 */
.minibar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px var(--gut);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transform:translateY(-6px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;margin-bottom:-56px;min-height:56px}
.minibar.show{opacity:1;transform:none;pointer-events:auto}
.minibar .mt{font-family:var(--serif);font-size:22px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hero{background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden}
.tinted{background:color-mix(in srgb,var(--b) 30%,var(--bg))}
.casemeta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(28px,5vw,80px);align-items:start;padding:64px var(--gut)}
.posterart{aspect-ratio:4/3;background:var(--b);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,3vw,40px);gap:10px}
.posterart .big{font-family:"Jost",sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,46px);line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:var(--ink);max-width:12ch}
.posterart .hand{font-family:"Caveat",cursive;font-size:clamp(26px,3vw,38px);color:var(--i);transform:rotate(-6deg);position:absolute;left:clamp(16px,3vw,36px);top:clamp(12px,2.4vw,28px)}
.posterart .tagline{position:absolute;right:16px;top:14px;font-size:10px;letter-spacing:.18em;font-weight:500;text-align:right}
.posterart .wmk{position:absolute;right:-10px;bottom:-14px;font-family:"Jost",sans-serif;font-weight:700;font-size:clamp(60px,9vw,120px);letter-spacing:-.05em;color:color-mix(in srgb,var(--i) 22%,transparent);line-height:.8}
.case{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:56px;align-items:start;padding:56px var(--gut) 80px;border-top:1px solid var(--rule)}
.case aside{position:sticky;top:140px;display:flex;flex-direction:column;gap:24px;font-size:13.5px}
.case aside h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:8px}
.toc a{display:block;text-decoration:none;color:var(--ink-2);padding:3px 0}
.toc a:hover{color:var(--ink)}
.abbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abbtn{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;border:1px solid var(--a);color:var(--a);background:transparent;cursor:pointer}
.abbtn i{width:9px;height:9px;border-radius:2px;background:var(--a)}
.abbtn.on{background:var(--a);color:var(--bg)} .abbtn.on i{background:var(--bg)}
.abbtn span{font-size:11px;opacity:.85}
.csec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:140px}
.csec h2{font-size:22px}
.blk{max-width:68ch}
.blk.ab{background:var(--abg);border-left:3px solid var(--a);padding:12px 16px 13px}
.blk.ab .ablab{font-size:10.5px;letter-spacing:.14em;color:var(--a);display:block;margin-bottom:3px;font-weight:500}
.blk table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.blk th,.blk td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.blk th{font-weight:500;color:var(--ink-3);font-size:12px}
.tablewrap{overflow-x:auto}
article.focus .blk{transition:opacity .2s}
article.focus-ins .blk:not(.ab-ins),article.focus-prac .blk:not(.ab-prac),article.focus-data .blk:not(.ab-data){opacity:.28}
.draft{display:inline-block;font-size:10.5px;letter-spacing:.1em;border:1px solid var(--ink-3);color:var(--ink-3);border-radius:999px;padding:1px 8px;margin-left:10px;vertical-align:middle;font-family:var(--geo);font-weight:500}
sup a{font-size:10.5px;text-decoration:none;color:var(--ink-3);padding-left:1px}
.inl{text-decoration:underline dotted var(--ink-3);text-underline-offset:4px}
.inl b{font-weight:400;color:var(--ink-3)}
.refs{display:flex;flex-direction:column;gap:6px;font-size:13.5px;padding-left:0;list-style:none;counter-reset:r;margin:0}
.refs li{counter-increment:r;display:flex;gap:10px}
.refs li::before{content:"[" counter(r) "]";font-size:12px;color:var(--ink-3);padding-top:1px;min-width:26px}

.search{border-top:1px solid var(--rule);padding:22px var(--gut) 26px;display:flex;flex-direction:column;gap:16px}
.search input[type=search]{font:inherit;font-size:16px;width:100%;padding:10px 0;border:none;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink)}
.search input[type=search]:focus{outline:none}

.sel.fnsel{background:var(--b);color:var(--i);border-color:var(--b)}
.sel .x{font-size:14px;line-height:1;opacity:.75;padding:0 4px}
.linkbtn{font:inherit;font-size:12.5px;background:none;border:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 4px}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;margin-left:auto}
.mode button{font:inherit;font-size:12px;border:none;background:transparent;color:var(--ink-2);padding:4px 12px;cursor:pointer}
.mode button.on{background:var(--ink);color:var(--bg)}
.ogroup{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:start}
.ogroup .lab{font-size:11px;letter-spacing:.16em;color:var(--ink-3);padding-top:6px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink-3);background:transparent;color:var(--ink-2);padding:4px 12px;border-radius:999px;cursor:pointer}
.opt:hover{border-color:var(--ink);color:var(--ink)}

.resultbar h2{font-family:var(--geo);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}

/* Off the Clock 手帐 */
.polaroid{position:relative;margin:0;background:var(--surface);padding:10px 10px 12px;box-shadow:0 1px 0 var(--line),0 10px 24px rgba(0,0,0,.08);transform:rotate(var(--r,0deg));width:var(--pw,200px)}
.polaroid .shot{aspect-ratio:4/5;background:var(--panel);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.polaroid .shot span{font-size:11px;letter-spacing:.2em;color:var(--ink-3)}
.polaroid .shot img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid figcaption{font-family:"Caveat",cursive;font-size:19px;line-height:1.2;padding-top:8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.polaroid .tape{position:absolute;top:-11px;left:50%;width:44%;height:22px;background:var(--b);opacity:.85;transform:translateX(-50%) rotate(-4deg)}
.stamp{position:absolute;width:70px;height:70px;border-radius:50%;border:1.5px dashed var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(var(--r,8deg));background:var(--bg);line-height:1.1;z-index:2}
.stamp b{font-size:14px;letter-spacing:.12em;font-weight:600}
.stamp i{font-style:normal;font-size:8.5px;letter-spacing:.06em;color:var(--ink-2);max-width:58px;text-align:center}
.pstack{position:relative;width:min(100%,360px);height:300px}
.pstack .polaroid{position:absolute}
.journal{font-family:var(--zhserif);font-size:16px;line-height:1.95;max-width:62ch}
.hobbyicon{width:120px;height:120px;color:var(--ink)}
.placeholder{color:var(--ink-3);border-bottom:1px dashed var(--ink-3)}

footer.foot{border-top:1px solid var(--rule);padding:22px var(--gut) 30px;font-size:12px;color:var(--ink-3);letter-spacing:.12em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

function tilesFor(w){
  const T=[];
  T.push({kind:'brand', fn:w.fns[0]});
  (w.highlights||[]).forEach((h,i)=>T.push({kind:'stat',k:h.k,v:h.v,fn:w.fns[(i+1)%w.fns.length]}));
  if(w.quote) T.push({kind:'quote',q:w.quote,fn:w.fns[w.fns.length-1]});
  T.push({kind:'concepts',fn:w.fns[0]});
  return T;
}
function tileHTML(w,t,pos){
  const st=`--x:${pos[0]}%;--y:${pos[1]}%;--w:${pos[2]}px;--r:${pos[3]}deg`;
  const bar=`<div class="tbar"><i></i><i></i><i></i></div>`;
  if(t.kind==='brand') return `<div class="tile phone fn-${t.fn}" style="${st}">${bar}<div class="tin" style="gap:10px;padding-block:18px"><span class="wm">${w.brands[0]}</span><span class="k">${TYPE_EN[w.type]}</span><div class="chiprow">${w.fns.map(f=>`<span>${fnOf(f).name}</span>`).join('')}</div></div></div>`;
  if(t.kind==='stat') return `<div class="tile fn-${t.fn}" style="${st}">${bar}<div class="tin"><span class="k">${t.k}</span><span class="v">${t.v}</span></div></div>`;
  if(t.kind==='quote') return `<div class="tile fn-${t.fn}" style="${st}">${bar}<div class="tin"><span class="k">Insight</span><span class="q">“${t.q}”</span></div></div>`;
  return `<div class="tile fn-${t.fn}" style="${st}">${bar}<div class="tin"><span class="k">Concepts</span><div class="chiprow">${w.concepts.slice(0,5).map(c=>`<span>#${cOf(c).name}</span>`).join('')}</div></div></div>`;
}
const POS_CARD=[[2,8,178,-7],[30,56,185,4],[58,6,200,-3],[62,58,180,6],[33,4,170,-4]];

function collage(w,pos,h){
  const T=tilesFor(w);

}

const TYPES=['品牌拆解','Case 分析','AI 实操','数据分析'];
const S={brand:new Set(),fn:new Set(),ind:new Set(),cpt:new Set(),type:new Set(),mode:'any',q:''};
const GROUPS=[
  {k:'brand', lab:'BRAND', opts:()=>[...new Set(WORKS.flatMap(w=>w.brands))].sort().map(b=>({v:b,label:b,n:WORKS.filter(w=>w.brands.includes(b)).length}))},
  {k:'fn', lab:'职能', opts:()=>FUNCTIONS.map(f=>({v:f.id,label:f.name,alt:f.en,n:WORKS.filter(w=>w.fns.includes(f.id)).length}))},
  {k:'ind', lab:'行业', opts:()=>Object.entries(INDUSTRIES).map(([k,v])=>({v:k,label:v.name,n:WORKS.filter(w=>w.industry===k).length}))},
  {k:'cpt', lab:'概念', opts:()=>CONCEPTS.map(c=>({v:c.id,label:c.name,alt:c.en,n:WORKS.filter(w=>w.concepts.includes(c.id)).length})).filter(o=>o.n>0)},
  {k:'type', lab:'类型', opts:()=>TYPES.map(t=>({v:t,label:t,alt:TYPE_EN[t],n:WORKS.filter(w=>w.type===t).length}))}
];
const tagsOf=(w,k)=>({brand:w.brands,fn:w.fns,ind:[w.industry],cpt:w.concepts,type:[w.type]})[k];
function matches(w){
  return GROUPS.every(g=>{const sel=[...S[g.k]]; if(!sel.length) return true; const t=tagsOf(w,g.k);
    return (S.mode==='all'&&['brand','fn','cpt'].includes(g.k))?sel.every(v=>t.includes(v)):sel.some(v=>t.includes(v));});
}
const anySel=()=>GROUPS.some(g=>S[g.k].size);
function labelOf(k,v){ if(k==='fn') return fnOf(v).name; if(k==='ind') return INDUSTRIES[v].name; if(k==='cpt') return '#'+cOf(v).name; return v; }
function optsHTML(){
  const q=S.q.trim().toLowerCase();
  return GROUPS.map(g=>{
    const os=g.opts().filter(o=>!q||o.label.toLowerCase().includes(q)||(o.alt||'').toLowerCase().includes(q));
    if(!os.length) return '';
    return `<div class="ogroup"><span class="lab">${g.lab}</span><div class="opts">${os.map(o=>{
      const on=S[g.k].has(o.v);
      const cls=g.k==='fn'?`fo fn-${o.v}`:g.k==='cpt'?'cp':'';
      const pre=g.k==='fn'?'<span class="dot"></span>':g.k==='ind'?indIcon(o.v):g.k==='cpt'?'<b>#</b>':'';
      return `<button class="opt ${cls} ${on?'on':''}" data-g="${g.k}" data-v="${o.v}" aria-pressed="${on}">${pre}${o.label}<span class="n">${o.n}</span></button>`}).join('')}</div></div>`;
  }).join('') || `<p class="faint" style="font-size:13px">没有匹配“${S.q}”的标签。</p>`;
}
function selHTML(){
  if(!anySel()) return `<span class="hint">选择下面的标签开始筛选。同一类标签可以多选。</span>`;
  const chips=GROUPS.flatMap(g=>[...S[g.k]].map(v=>`<button class="sel ${g.k==='fn'?'fnsel fn-'+v:''}" data-rm="${g.k}" data-v="${v}" title="移除">${labelOf(g.k,v)}<span class="x" aria-hidden="true">×</span></button>`)).join('');
  return `${chips}<button class="linkbtn" data-clear="1">清除全部</button>
    <div class="mode" role="group" aria-label="同类标签匹配方式"><button data-mode="any" class="${S.mode==='any'?'on':''}">同类满足任一</button><button data-mode="all" class="${S.mode==='all'?'on':''}">同类全部满足</button></div>`;
}
function resultsHTML(){

/* ===== 外壳与路由 ===== */
function shell(html, nav){
  const items=[['about','About'],['notes','Notes'],['works','Portfolio'],['life','Off the Clock']];
  return `<header class="top"><div class="bar"><a class="caps" href="#home" style="font-size:13px">Home</a>
      <nav class="caps" style="font-size:12.5px" aria-label="主导航">${items.map(([h,t])=>`<a href="#${h}" class="${nav===h?'on':''}">${t}</a>`).join('')}</nav></div></header>
    <main id="app">${html}</main>
    <footer class="foot"><span>HANNAH · 营销手记</span><span>NOTES · PORTFOLIO · OFF THE CLOCK</span></footer>`;
}
let io=null;
function route(){
  const h=(location.hash||'#home').slice(1);
  if(io){io.disconnect();io=null}
  if(h==='home'||h===''){ root.innerHTML=home(); app=null; window.scrollTo(0,0); return; }
  let html, nav='';
  if(h==='notes'){html=notes();nav='notes'}
  else if(h==='concepts'){html=concepts();nav='notes'}
  else if(h==='library'){html=library();nav='notes'}
  else if(h.startsWith('fn-')){html=fnPage(h.slice(3));nav='notes'}
  else if(h.startsWith('c-')){html=conceptPage(h.slice(2));nav='notes'}
  else if(h.startsWith('r-')){html=resPage(h.slice(2));nav='notes'}
  else if(h==='works'){html=works();nav='works'}
  else if(h.startsWith('w-')){html=workPage(h.slice(2));nav='works'}
  else if(h==='life'){html=life();nav='life'}
  else if(h.startsWith('t-')){html=tripPage(h.slice(2));nav='life'}
  else if(h==='about'){html=about();nav='about'}
  else html=notFound();
  root.innerHTML=shell(html,nav); app=$('#app');
  window.scrollTo(0,0);
  const ct=$('#casetitle'), mb=$('#minibar');
  if(ct&&mb&&'IntersectionObserver' in window){io=new IntersectionObserver(([e])=>mb.classList.toggle('show',!e.isIntersecting),{rootMargin:'-64px 0px 0px 0px'});io.observe(ct)}
}
root.addEventListener('click',e=>{
  const lib=e.target.closest('[data-lib]'); if(lib){libFilter=lib.dataset.lib;app.innerHTML=library();return}
  const o=e.target.closest('[data-g]'); if(o){const s=S[o.dataset.g],v=o.dataset.v; s.has(v)?s.delete(v):s.add(v); refreshSearch(); return}
  const rm=e.target.closest('[data-rm]'); if(rm){S[rm.dataset.rm].delete(rm.dataset.v); refreshSearch(); return}
  if(e.target.closest('[data-clear]')){GROUPS.forEach(g=>S[g.k].clear()); refreshSearch(); return}
  const md=e.target.closest('[data-mode]'); if(md){S.mode=md.dataset.mode; refreshSearch(); return}
  const br=e.target.closest('[data-brand]'); if(br){GROUPS.forEach(g=>S[g.k].clear()); S.q=''; S.brand.add(br.dataset.brand);
    if(location.hash==='#works') route(); else location.hash='works'; return}
  const ab=e.target.closest('[data-ab]'); if(ab){const art=$('#art'),k=ab.dataset.ab,on=ab.classList.contains('on');
    document.querySelectorAll('.abbtn').forEach(b=>b.classList.remove('on')); art.className='stack focus';
    if(!on){ab.classList.add('on');art.classList.add('focus-'+k)} return}
  const j=e.target.closest('[data-jump]'); if(j){e.preventDefault();document.getElementById(j.dataset.jump).scrollIntoView({behavior:'smooth'})}
});
root.addEventListener('input',e=>{ if(e.target.id==='tagq'){S.q=e.target.value; $('#opts').innerHTML=optsHTML();} });
window.addEventListener('hashchange',route);
route();
</script>

<script>
(function(){
  const fab=document.getElementById('coachFab'), panel=document.getElementById('coach'), log=document.getElementById('coachLog'),
        form=document.getElementById('coachForm'), input=document.getElementById('coachInput'), sendBtn=document.getElementById('coachSend'),
        errBox=document.getElementById('coachErr');
  let sample=null, turns=[], ctl=null, busy=false;

  /* ---- 把网站数据整理成助教能读的资料 ---- */
  const strip=s=>s.replace(/\{\{c:([\w-]+)\}\}/g,(_,id)=>{const c=CONCEPTS.find(x=>x.id===id);return c?c.name:''})
                  .replace(/\{\{r:[\w-]+\}\}/g,'').replace(/<\/(td|th)>/g,' | ').replace(/<\/tr>/g,'\n').replace(/<[^>]+>/g,'').replace(/[ \t]+/g,' ').trim();
  const fnName=id=>(FUNCTIONS.find(f=>f.id===id)||{}).name||id;
  const cName=id=>(CONCEPTS.find(c=>c.id===id)||{}).name||id;
  function siteContext(){
    const L=[];
    L.push('## 页面导航 id\nhome 首页；notes 职能分支；concepts 概念词典；library 资料库；works 作品集与标签检索；life 生活与兴趣；about 关于我');
    L.push('## 职能分支（8 个）');
    FUNCTIONS.forEach(f=>L.push(`- [fn-${f.id}] ${f.name}（${f.en}）：${f.what} 关键指标：${f.metrics.join('、')}。常用工具：${f.tools.join('、')}。AI 影响：${f.ai} 我的笔记：还没写。`));
    L.push('## 概念词典');
    CONCEPTS.forEach(c=>{const used=WORKS.filter(w=>w.concepts.includes(c.id)).map(w=>w.title);
      L.push(`- [c-${c.id}] ${c.name}（${c.en}）${c.core?'【核心基础】':''}：${c.def} 所属职能：${c.fns.map(fnName).join('、')}。学自：${c.from.map(r=>(RESOURCES.find(x=>x.id===r)||{}).title).filter(Boolean).join('；')||'暂无'}。用于作品：${used.join('；')||'暂无'}。`)});
    L.push('## 资料库');
    RESOURCES.forEach(r=>L.push(`- [r-${r.id.slice(2)}] ${r.type}《${r.title}》，${r.source}${r.date?'，'+r.date:''}，状态：${r.status}。职能：${r.fns.map(fnName).join('、')}。笔记：${r.note.length?r.note.join(' / '):'还没有笔记'}`));
    L.push('## 作品集');
    WORKS.forEach(w=>{
      L.push(`### [w-${w.id}] ${w.title}\n类型：${w.type}；日期：${w.date}；品牌：${w.brands.join('、')}；行业：${INDUSTRIES[w.industry].name}；职能：${w.fns.map(fnName).join('、')}；概念：${w.concepts.map(cName).join('、')}\n一句话结论：${w.tldr}`);
      w.sections.forEach(s=>L.push(`【${s.h}${s.draft?'（草稿，待改写）':''}】\n`+s.blocks.map(b=>`${b.ab?'('+ABILITIES[b.ab]+') ':''}${strip(b.html)}`).join('\n')));
    });
    return L.join('\n');
  }
  function rules(){
    const where=(location.hash||'#home').slice(1);
    return `你是个人学习网站「营销手记」里内置的助教 Ayato。网站主人正在从零系统学习 marketing，并用这个网站记录学习笔记和作品集。

【性格与语气】你是 ESTJ 型的带教前辈：务实、直接、讲效率、重结构和执行。
- 先给结论，再分点说明，常用“第一、第二”。
- 每次回答尽量落到一个明确的下一步行动，必要时排优先级。
- 不寒暄、不说空话、不过度夸奖；发现问题直接指出，但不刻薄。
- 默认简洁，一般 200 字以内；对方要求展开时再展开。

【回答依据】
- 以下面的「网站数据」为准回答网站相关的问题。网站里没有的内容，直接说“网站里还没有这部分”，不要编造作品、笔记、数据或阅读状态。
- 可以补充通用营销知识，但要在那句话后标注“（网站外的通用知识）”。
- 提到网站里的页面时，用 [[页面id|显示文字]] 的格式写成链接，例如 [[c-incremental|增量人群]]、[[w-nikeskims|NikeSKIMS 案例]]。只能使用网站数据里方括号中出现过的 id，或 home、notes、concepts、library、works、life、about。
- 格式只用段落、**加粗**、以“- ”或“1. ”开头的列表。不要用标题、表格或代码块。

用户当前正在看的页面 id：${where}

【网站数据】
${siteContext()}`;
  }

  /* ---- 渲染回答：转义后只支持链接、加粗和列表 ---- */
  const VALID=()=>new Set(['home','notes','concepts','library','works','life','about',...FUNCTIONS.map(f=>'fn-'+f.id),...CONCEPTS.map(c=>'c-'+c.id),...RESOURCES.map(r=>'r-'+r.id.slice(2)),...WORKS.map(w=>'w-'+w.id)]);
  const esc=s=>s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  function inline(s,valid){
    return esc(s).replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g,(m,id,t)=>valid.has(id)?`<a href="#${id}">${t}</a>`:t)
                 .replace(/\[\[([\w-]+)\]\]/g,(m,id)=>valid.has(id)?`<a href="#${id}">${id}</a>`:'')
                 .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  }
  function render(md){
    const valid=VALID(), out=[]; let list=null;
    md.split('\n').forEach(raw=>{
      const line=raw.trim(), ul=line.match(/^[-•]\s+(.*)/), ol=line.match(/^\d+[.、]\s*(.*)/);
      if(ul||ol){const tag=ul?'ul':'ol'; if(!list||list.tag!==tag){list={tag,items:[]};out.push(list)} list.items.push(inline((ul||ol)[1],valid)); return}
      list=null; if(line) out.push(`<p>${inline(line.replace(/^#+\s*/,''),valid)}</p>`);
    });
    return out.map(x=>typeof x==='string'?x:`<${x.tag}>${x.items.map(i=>`<li>${i}</li>`).join('')}</${x.tag}>`).join('');
  }

  /* ---- 界面 ---- */
  const SUGG=['NikeSKIMS 这篇案例用到了哪些概念？','资料库里哪些我还没读？先读哪本？','我下一篇作品该做什么？'];
  function intro(){
    log.innerHTML=`<div class="coach-intro"><p>我是 Ayato。网站里的笔记、概念、资料和作品我都看过，直接问。</p>
      <div class="sugg">${SUGG.map(q=>`<button type="button" data-q="${q}">${q}</button>`).join('')}</div></div>`;
  }
  function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
  function setBusy(b){busy=b;sendBtn.textContent=b?'停止':'发送';sendBtn.classList.toggle('stop',b);sendBtn.type=b?'button':'submit'}
  function showErr(t){errBox.textContent=t;errBox.hidden=!t}
  const COPY={rate_limited:'问得太频繁或已达到用量上限，稍后再试。',session_expired:'登录已过期，请重新登录 claude.ai。',refused:'这个问题我没法回答，换个问法。',
    empty_completion:'没有得到回答，换个更具体的问法。',prompt_too_large:'对话太长了，点“清空”重新开始。'};

  async function ask(q){
    if(busy||!q.trim()) return;
    showErr('');
    if(log.querySelector('.coach-intro')) log.innerHTML='';
    add('me',esc(q));
    turns.push({role:'user',content:q});
    if(turns.length>16) turns=turns.slice(-16);
    while(turns.length&&turns[0].role!=='user') turns.shift();
    const bubble=add('bot','<span class="thinking">思考中…</span>');
    ctl=new AbortController(); setBusy(true);
    try{
      const {text,truncated}=await sample([{role:'user',content:rules()},...turns],{cache:false,signal:ctl.signal,
        onText:({text})=>{bubble.innerHTML=render(text);log.scrollTop=log.scrollHeight}});
      bubble.innerHTML=render(text)+(truncated?'<p class="thinking">（回答被截断了，可以让我继续。）</p>':'');
      turns.push({role:'assistant',content:text});
    }catch(e){
      const code=e&&e.code;
      if(e&&e.text){bubble.innerHTML=render(e.text)+'<p class="thinking">（已中断）</p>';turns.push({role:'assistant',content:e.text})}
      else {bubble.remove();turns.pop()}
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){
        add('note','这个页面没有获得使用 Claude 的许可，助教已关闭。可以在页面的权限菜单里重新允许。');form.hidden=true;
      } else if(code!=='cancelled') showErr(COPY[code]||'连接出了问题，再发一次试试。');
    }finally{setBusy(false);ctl=null}
  }

  fab.onclick=()=>{panel.hidden=false;fab.hidden=true;if(!log.children.length)intro();input.focus()};
  document.getElementById('coachClose').onclick=()=>{panel.hidden=true;fab.hidden=false};
  document.getElementById('coachClear').onclick=()=>{if(ctl)ctl.abort();turns=[];showErr('');intro()};
  sendBtn.addEventListener('click',e=>{if(busy){e.preventDefault();ctl&&ctl.abort()}});
  form.addEventListener('submit',e=>{e.preventDefault();const q=input.value;input.value='';input.style.height='';ask(q)});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}});
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';showErr('')});
  log.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b)ask(b.dataset.q)});

  /* 只有在 claude.ai 里打开时才有助教；其他地方自动隐藏 */
  if(window.claude&&window.claude.use){
    window.claude.use('sample').then(s=>{if(s){sample=s;fab.hidden=false}}).catch(()=>{});
  }
})();
</script>

<style>.coach-fab{font-family:var(--geo);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:500}.coach-fab .av,.coach-head .av{font-family:var(--geo)}.coach,.coach-head .iconbtn,.coach-form textarea,.coach-form button{font-family:var(--geo)}.coach{border:1px solid var(--rule);border-radius:0}.coach-head{border-bottom:1px solid var(--rule)}</style>
